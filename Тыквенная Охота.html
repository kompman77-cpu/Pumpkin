<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Тыквенная Охота</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0033;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#game{width:100vw;height:100vh;position:relative;background:radial-gradient(ellipse at center,#3d1a6b 0%,#1a0033 100%);overflow:hidden;touch-action:none;}
.frame{position:absolute;top:6px;left:6px;right:6px;bottom:6px;border:3px solid rgba(180,120,255,0.35);border-radius:18px;pointer-events:none;z-index:100;box-shadow:inset 0 0 30px rgba(100,50,180,0.2);}
.stars{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0.6;animation:twinkle 3s infinite;}
@keyframes twinkle{0%,100%{opacity:0.2;}50%{opacity:0.8;}}

/* Top bar */
#topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:16px;align-items:center;}
.stat{background:rgba(60,20,100,0.7);border:1px solid rgba(180,120,255,0.3);border-radius:12px;padding:7px 14px;font-size:clamp(14px,3.5vw,20px);color:#ffcc44;font-weight:bold;white-space:nowrap;}
.stat small{color:#aa88dd;font-weight:normal;font-size:0.7em;}
#btnSound,#btnFS{position:absolute;z-index:60;top:14px;background:rgba(60,20,100,0.7);border:1px solid rgba(180,120,255,0.3);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;color:#cc99ff;display:flex;align-items:center;justify-content:center;}
#btnSound{right:14px;}#btnFS{right:64px;}

/* Holes */
#holes{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;}
.hole-row{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:clamp(20px,8vw,80px);}
.hole-row.top{top:28%;}
.hole-row.bottom{top:58%;}
.hole-wrap{position:relative;}
.hole{width:clamp(70px,18vw,130px);height:clamp(70px,18vw,130px);border-radius:50%;background:radial-gradient(circle at 45% 40%,#0d0518 30%,#1a0a2e 65%,#2a1240 100%);border:3px solid rgba(90,50,120,0.5);box-shadow:inset 0 0 20px rgba(0,0,0,0.7),0 4px 10px rgba(0,0,0,0.4);position:relative;overflow:hidden;}

/* Character inside hole — smooth slide up/down, NO flickering */
.char{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);width:85%;height:85%;transition:bottom 0.28s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;will-change:bottom,transform;}
.char.up{bottom:8%;pointer-events:auto;}
.char.hit{bottom:-100%!important;transition:bottom 0.15s ease-in;pointer-events:none;}

/* Pumpkin */
.pumpkin-body{width:100%;height:100%;position:relative;}
.pumpkin-svg{width:100%;height:100%;}

/* Ghost */
.ghost-svg{width:100%;height:100%;}

/* Particles */
.particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:200;will-change:transform,opacity;}

/* Screens */
.screen{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,0,50,0.92);backdrop-filter:blur(6px);}
.screen h1{color:#ffaa33;font-size:clamp(28px,7vw,52px);margin-bottom:6px;text-shadow:0 0 20px rgba(255,170,50,0.4);font-weight:bold;}
.screen h2{color:#cc88ff;font-size:clamp(22px,5vw,38px);margin-bottom:18px;}
.screen p{color:#ddaaff;font-size:clamp(16px,4vw,22px);margin-bottom:8px;text-align:center;}
.score-big{color:#ffcc44;font-size:clamp(36px,9vw,64px);font-weight:bold;margin:10px 0;text-shadow:0 0 25px rgba(255,204,68,0.3);}
.score-label{color:#aa88dd;font-size:clamp(14px,3.5vw,18px);}
.btn{margin:8px;padding:14px 36px;font-size:clamp(16px,4vw,22px);border:none;border-radius:30px;cursor:pointer;font-weight:bold;transition:transform 0.1s,box-shadow 0.2s;}
.btn:active{transform:scale(0.94);}
.btn-primary{background:linear-gradient(135deg,#ff8c1a,#ff6633);color:#fff;box-shadow:0 4px 15px rgba(255,100,30,0.4);}
.btn-primary:active{box-shadow:0 2px 8px rgba(255,100,30,0.3);}
.btn-secondary{background:linear-gradient(135deg,#9b59b6,#7d3c98);color:#fff;box-shadow:0 4px 15px rgba(120,60,150,0.4);}
.btn-locked{background:#3a2548;color:#665577;cursor:not-allowed;box-shadow:none;}
.btn-locked:active{transform:none;}
.lock-icon{font-size:0.8em;margin-right:6px;}
.round-btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:20px;}
.round-info{color:#8866aa;font-size:clamp(12px,3vw,15px);margin-top:4px;}
.red-flash{position:fixed;inset:0;background:rgba(255,0,0,0.35);z-index:150;pointer-events:none;opacity:0;}
.red-flash.show{animation:flash 0.3s;}
@keyframes flash{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}
.lives{display:flex;gap:4px;align-items:center;}
.heart{font-size:clamp(16px,4vw,22px);}
.heart.lost{opacity:0.25;filter:grayscale(1);}
.menu-deco{position:absolute;font-size:clamp(30px,8vw,60px);opacity:0.15;animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-20px) rotate(5deg);}}
#btnNext{margin-top:8px;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="game">
<div class="frame"></div>
<div class="stars" id="stars"></div>

<button id="btnFS">⛶</button>
<button id="btnSound">🔊</button>

<!-- MENU -->
<div class="screen" id="menuScreen">
<h1>🎃 Тыквенная Охота</h1>
<p class="score-label">Общий счёт: <span id="menuTotalScore">0</span></p>
<div class="round-btns">
<button class="btn btn-primary" id="btnRound1" onclick="startRound(1)">Раунд 1<br><span class="round-info">5 минут · 4→0.5 сек</span></button>
<button class="btn btn-locked" id="btnRound2"><span class="lock-icon">🔒</span>Раунд 2<br><span class="round-info">4 минуты · 3→0.5 сек</span></button>
<button class="btn btn-locked" id="btnRound3"><span class="lock-icon">🔒</span>Раунд 3<br><span class="round-info">2 минуты · 1→0.5 сек</span></button>
</div>
<p class="round-info" style="margin-top:24px;">Тапай по тыквам 🎃 · Не трогай привидения 👻</p>
</div>

<!-- GAME -->
<div id="topbar" class="hidden">
<div class="stat">⏱ <span id="timer">5:00</span></div>
<div class="stat">🎃 <span id="score">0</span></div>
<div class="stat lives" id="livesDisplay">❤️❤️❤️</div>
</div>

<div id="holes"></div>

<!-- ROUND CLEAR -->
<div class="screen hidden" id="clearScreen">
<h2>✅ Раунд пройден!</h2>
<p>Очки за раунд: <span id="roundScore">0</span></p>
<p class="score-label">Общий счёт: <span id="clearTotalScore">0</span></p>
<button class="btn btn-primary" id="btnNext">Следующий раунд</button>
<button class="btn btn-secondary" onclick="goMenu()">В меню</button>
</div>

<!-- GAME OVER -->
<div class="screen hidden" id="overScreen">
<h2>💀 Игра окончена</h2>
<p>Очки за раунд: <span id="overRoundScore">0</span></p>
<p class="score-label">Общий счёт: <span id="overTotalScore">0</span></p>
<button class="btn btn-secondary" onclick="goMenu()">Вернуться в меню</button>
</div>

<!-- ALL CLEAR -->
<div class="screen hidden" id="allClearScreen">
<h1>🏆 Поздравляем!</h1>
<p>Все раунды пройдены!</p>
<div class="score-big" id="finalScore">0</div>
<button class="btn btn-primary" onclick="goMenu()">В меню</button>
</div>

<div class="red-flash" id="redFlash"></div>
</div>

<script>
// ============ STARS ============
(function(){
var c=document.getElementById('stars');
for(var i=0;i<50;i++){
var s=document.createElement('div');s.className='star';
s.style.left=Math.random()*100+'%';
s.style.top=Math.random()*100+'%';
s.style.animationDelay=Math.random()*3+'s';
s.style.width=s.style.height=(1+Math.random()*2)+'px';
c.appendChild(s);
}
})();

// ============ STATE ============
var state={
round:0,score:0,totalScore:0,lives:3,
timeLeft:0,roundTime:0,showTime:4,
running:false,unlocked:1,
spawnTimer:null,tickTimer:null
};

// Load progress
try{
var saved=JSON.parse(localStorage.getItem('pumpkinHunt')||'{}');
state.totalScore=saved.totalScore||0;
state.unlocked=saved.unlocked||1;
}catch(e){}

function saveProgress(){
try{
localStorage.setItem('pumpkinHunt',JSON.stringify({totalScore:state.totalScore,unlocked:state.unlocked}));
}catch(e){}
}

// ============ HOLES ============
var HOLES=[];
function buildHoles(){
var container=document.getElementById('holes');
container.innerHTML='';
HOLES=[];
var rows=['top','bottom'];
for(var r=0;r<2;r++){
var rowDiv=document.createElement('div');
rowDiv.className='hole-row '+rows[r];
for(var i=0;i<3;i++){
var idx=r*3+i;
var wrap=document.createElement('div');
wrap.className='hole-wrap';
var hole=document.createElement('div');
hole.className='hole';
var ch=document.createElement('div');
ch.className='char';
ch.dataset.idx=idx;
ch.addEventListener('pointerdown',function(e){onHit(e);});
hole.appendChild(ch);
wrap.appendChild(hole);
rowDiv.appendChild(wrap);
HOLES.push({el:ch,active:false,type:null,idx:idx});
}
container.appendChild(rowDiv);
}
}

// ============ PUMPKIN SVG ============
function pumpkinSVG(){
return '<svg class="pumpkin-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+
'<ellipse cx="50" cy="55" rx="40" ry="36" fill="#cc6600"/>'+
'<ellipse cx="28" cy="55" rx="14" ry="34" fill="#dd7700"/>'+
'<ellipse cx="72" cy="55" rx="14" ry="34" fill="#dd7700"/>'+
'<ellipse cx="50" cy="55" rx="38" ry="36" fill="#e67e00"/>'+
'<rect x="47" y="14" width="6" height="14" rx="2" fill="#3a6b1a"/>'+
'<path d="M47 16 Q40 10 42 16 Q45 14 47 16" fill="#4a8b2a"/>'+
'<!-- Eyes -->'+
'<polygon points="30,42 40,42 35,52" fill="#fff200"/>'+
'<polygon points="60,42 70,42 65,52" fill="#fff200"/>'+
'<!-- Nose -->'+
'<polygon points="46,52 54,52 50,60" fill="#ffaa00"/>'+
'<!-- Mouth -->'+
'<path d="M30 65 Q35 72 40 68 Q45 72 50 68 Q55 72 60 68 Q65 72 70 65 L68 62 L30 62 Z" fill="#fff200"/>'+
'</svg>';
}

// ============ GHOST SVG ============
function ghostSVG(){
return '<svg class="ghost-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+
'<path d="M50 10 C25 10 18 30 18 55 L18 82 L25 75 L32 82 L39 75 L46 82 L53 75 L60 82 L67 75 L74 82 L82 75 L82 55 C82 30 75 10 50 10 Z" fill="rgba(240,240,255,0.85)" stroke="rgba(200,200,230,0.5)" stroke-width="1"/>'+
'<ellipse cx="38" cy="40" rx="7" ry="9" fill="#1a0033"/>'+
'<ellipse cx="62" cy="40" rx="7" ry="9" fill="#1a0033"/>'+
'<ellipse cx="38" cy="38" rx="2" ry="3" fill="#fff"/>'+
'<ellipse cx="62" cy="38" rx="2" ry="3" fill="#fff"/>'+
'<ellipse cx="44" cy="55" rx="3" ry="2" fill="rgba(255,150,150,0.6)"/>'+
'<ellipse cx="56" cy="55" rx="3" ry="2" fill="rgba(255,150,150,0.6)"/>'+
'</svg>';
}

// ============ SPAWN ============
function getShowTime(){
var minutesLeft=Math.ceil(state.timeLeft/60);
if(minutesLeft>=5)return 4;
if(minutesLeft===4)return 3;
if(minutesLeft===3)return 2;
if(minutesLeft===2)return 1;
return 0.5;
}

function spawnOne(){
if(!state.running)return;
var free=HOLES.filter(function(h){return !h.active;});
if(free.length===0)return;

// Pick 1-3 random free holes
var count=Math.min(free.length,1+Math.floor(Math.random()*3));
var chosen=[];
for(var i=0;i<count;i++){
var idx=Math.floor(Math.random()*free.length);
chosen.push(free[idx]);
free.splice(idx,1);
}

var st=getShowTime();

for(var i=0;i<chosen.length;i++){
(function(hole){
hole.active=true;
// Ghosts 67%, pumpkins 33%
hole.type=Math.random()<0.67?'ghost':'pumpkin';
hole.el.innerHTML=hole.type==='pumpkin'?pumpkinSVG():ghostSVG();
hole.el.className='char';
// Force reflow, then animate up
void hole.el.offsetHeight;
hole.el.style.bottom='8%';
hole.el.classList.add('up');
hole.el.dataset.type=hole.type;

setTimeout(function(){
if(hole.active && state.running){
hole.el.classList.remove('up');
hole.el.style.bottom='-100%';
setTimeout(function(){
hole.active=false;
hole.el.innerHTML='';
hole.el.className='char';
},300);
}
},st*1000);
})(chosen[i]);
}
}

function spawnLoop(){
if(!state.running)return;
spawnOne();
var delay=400+Math.random()*500;
state.spawnTimer=setTimeout(spawnLoop,delay);
}

// ============ HIT ============
function onHit(e){
e.preventDefault();
var el=e.currentTarget;
if(!el.classList.contains('up'))return;
if(el.dataset.type==='pumpkin'){
state.score++;
document.getElementById('score').textContent=state.score;
// Particles
spawnParticles(e.clientX,e.clientY,'#ff8c1a');
// Pop sound
playPop();
// Quick hide
el.classList.remove('up');
el.classList.add('hit');
var idx=parseInt(el.dataset.idx);
var hole=HOLES[idx];
hole.active=false;
setTimeout(function(){
el.innerHTML='';
el.className='char';
el.style.bottom='-100%';
},200);
}else{
// Ghost hit — lose life
state.lives--;
updateLives();
playGhost();
flashRed();
el.classList.remove('up');
el.classList.add('hit');
var idx2=parseInt(el.dataset.idx);
var hole2=HOLES[idx2];
hole2.active=false;
setTimeout(function(){
el.innerHTML='';
el.className='char';
el.style.bottom='-100%';
},200);
if(state.lives<=0){
endGame();
}
}
}

function spawnParticles(x,y,color){
for(var i=0;i<12;i++){
var p=document.createElement('div');
p.className='particle';
p.style.left=x+'px';
p.style.top=y+'px';
p.style.background=color;
p.style.opacity='0';
document.body.appendChild(p);
var ang=Math.random()*Math.PI*2;
var dist=30+Math.random()*50;
var dx=Math.cos(ang)*dist;
var dy=Math.sin(ang)*dist;
p.animate([
{transform:'translate(0,0) scale(1)',opacity:1},
{transform:'translate('+dx+'px,'+dy+'px) scale(0)',opacity:0}
],{duration:500,easing:'ease-out'});
setTimeout(function(){p.remove();},520);
}
}

function flashRed(){
var f=document.getElementById('redFlash');
f.classList.remove('show');
void f.offsetHeight;
f.classList.add('show');
setTimeout(function(){f.classList.remove('show');},320);
}

function updateLives(){
var html='';
for(var i=0;i<3;i++){
html+='<span class="heart'+(i>=state.lives?' lost':'')+'">❤️</span>';
}
document.getElementById('livesDisplay').innerHTML=html;
}

// ============ ROUND LOGIC ============
function startRound(r){
state.round=r;
state.score=0;
state.lives=3;
state.running=true;

if(r===1){state.roundTime=300;state.timeLeft=300;}
if(r===2){state.roundTime=240;state.timeLeft=240;}
if(r===3){state.roundTime=120;state.timeLeft=120;}

document.getElementById('score').textContent='0';
updateLives();
updateTimer();

document.getElementById('menuScreen').classList.add('hidden');
document.getElementById('clearScreen').classList.add('hidden');
document.getElementById('overScreen').classList.add('hidden');
document.getElementById('allClearScreen').classList.add('hidden');
document.getElementById('topbar').classList.remove('hidden');

// Fullscreen
goFullscreen();

// Clear all holes
HOLES.forEach(function(h){h.active=false;h.el.innerHTML='';h.el.className='char';h.el.style.bottom='-100%';});

// Start music
startMusic();

// Start spawn loop
clearTimeout(state.spawnTimer);
setTimeout(spawnLoop,600);

// Start timer
clearInterval(state.tickTimer);
state.tickTimer=setInterval(tick,1000);
}

function tick(){
state.timeLeft--;
updateTimer();
if(state.timeLeft<=0){
roundClear();
}
}

function updateTimer(){
var m=Math.floor(state.timeLeft/60);
var s=state.timeLeft%60;
document.getElementById('timer').textContent=m+':'+(s<10?'0':'')+s;
}

function roundClear(){
state.running=false;
clearTimeout(state.spawnTimer);
clearInterval(state.tickTimer);
state.totalScore+=state.score;
saveProgress();

// Hide all chars
HOLES.forEach(function(h){
h.active=false;
h.el.classList.remove('up');
h.el.style.bottom='-100%';
setTimeout(function(){h.el.innerHTML='';},300);
});

stopMusic();

if(state.round<3){
// Unlock next round
if(state.unlocked<state.round+1){
state.unlocked=state.round+1;
saveProgress();
}
document.getElementById('roundScore').textContent=state.score;
document.getElementById('clearTotalScore').textContent=state.totalScore;
document.getElementById('clearScreen').classList.remove('hidden');
document.getElementById('topbar').classList.add('hidden');
updateMenuButtons();
document.getElementById('btnNext').onclick=function(){
startRound(state.round+1);
};
document.getElementById('btnNext').textContent=state.round+1<=3?('Раунд '+(state.round+1)):'';
}else{
// All done
document.getElementById('finalScore').textContent=state.totalScore;
document.getElementById('allClearScreen').classList.remove('hidden');
document.getElementById('topbar').classList.add('hidden');
}
}

function endGame(){
state.running=false;
clearTimeout(state.spawnTimer);
clearInterval(state.tickTimer);
state.totalScore+=state.score;
saveProgress();

HOLES.forEach(function(h){
h.active=false;
h.el.classList.remove('up');
h.el.style.bottom='-100%';
setTimeout(function(){h.el.innerHTML='';},300);
});

stopMusic();

document.getElementById('overRoundScore').textContent=state.score;
document.getElementById('overTotalScore').textContent=state.totalScore;
document.getElementById('overScreen').classList.remove('hidden');
document.getElementById('topbar').classList.add('hidden');
updateMenuButtons();
}

function goMenu(){
state.running=false;
clearTimeout(state.spawnTimer);
clearInterval(state.tickTimer);
stopMusic();
document.getElementById('menuScreen').classList.remove('hidden');
document.getElementById('clearScreen').classList.add('hidden');
document.getElementById('overScreen').classList.add('hidden');
document.getElementById('allClearScreen').classList.add('hidden');
document.getElementById('topbar').classList.add('hidden');
HOLES.forEach(function(h){h.active=false;h.el.innerHTML='';h.el.className='char';h.el.style.bottom='-100%';});
updateMenuButtons();
document.getElementById('menuTotalScore').textContent=state.totalScore;
}

function updateMenuButtons(){
var b1=document.getElementById('btnRound1');
var b2=document.getElementById('btnRound2');
var b3=document.getElementById('btnRound3');

b1.className='btn btn-primary';
b1.innerHTML='Раунд 1<br><span class="round-info">5 минут · 4→0.5 сек</span>';
b1.onclick=function(){startRound(1);};

if(state.unlocked>=2){
b2.className='btn btn-primary';
b2.innerHTML='Раунд 2<br><span class="round-info">4 минуты · 3→0.5 сек</span>';
b2.onclick=function(){startRound(2);};
}else{
b2.className='btn btn-locked';
b2.innerHTML='<span class="lock-icon">🔒</span>Раунд 2<br><span class="round-info">4 минуты · 3→0.5 сек</span>';
b2.onclick=null;
}

if(state.unlocked>=3){
b3.className='btn btn-primary';
b3.innerHTML='Раунд 3<br><span class="round-info">2 минуты · 1→0.5 сек</span>';
b3.onclick=function(){startRound(3);};
}else{
b3.className='btn btn-locked';
b3.innerHTML='<span class="lock-icon">🔒</span>Раунд 3<br><span class="round-info">2 минуты · 1→0.5 сек</span>';
b3.onclick=null;
}

document.getElementById('menuTotalScore').textContent=state.totalScore;
}

// ============ FULLSCREEN ============
function goFullscreen(){
var el=document.getElementById('game');
if(el.requestFullscreen)el.requestFullscreen()['catch'](function(){});
else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
}
document.getElementById('btnFS').addEventListener('pointerdown',function(e){
e.preventDefault();
var el=document.getElementById('game');
if(!document.fullscreenElement&&!document.webkitFullscreenElement){
goFullscreen();
}else{
if(document.exitFullscreen)document.exitFullscreen();
else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
}
});

// ============ AUDIO: The Entertainer ============
var audioCtx=null;
var musicGain=null;
var musicTimer=null;
var isMuted=false;

function ensureAudio(){
if(!audioCtx){
try{
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
musicGain=audioCtx.createGain();
musicGain.gain.value=0.22;
musicGain.connect(audioCtx.destination);
}catch(e){return false;}
}
if(audioCtx.state==='suspended')audioCtx.resume();
return true;
}

// Note frequency helper
function noteFreq(n){
// n is MIDI note number
return 440*Math.pow(2,(n-69)/12);
}

// The Entertainer main notes (MIDI note, duration in beats)
// tempo ~ quarter=100, so beat=0.6s
var tempo=0.5; // seconds per beat (120 BPM for lively feel)
var melody=[
// Section A
[76,1],[68,1],[72,0.5],[76,0.5],[79,2],
[77,0.5],[76,0.5],[77,1],[72,1],[0,1],
[72,0.5],[76,0.5],[79,1],[76,1],[72,0.5],[76,0.5],
[79,1],[81,1],[77,0.5],[76,0.5],[72,2],[0,0.5],

function playNote(freq,start,dur,vol,type){
if(freq===0||!freq)return;
var osc=audioCtx.createOscillator();
var g=audioCtx.createGain();
osc.type=type||'sine';
osc.frequency.value=freq;
g.gain.setValueAtTime(0,audioCtx.currentTime+start);
g.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+start+0.01);
g.gain.setValueAtTime(vol,audioCtx.currentTime+start+dur*0.7);
g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+start+dur);
osc.connect(g);
g.connect(musicGain);
osc.start(audioCtx.currentTime+start);
osc.stop(audioCtx.currentTime+start+dur+0.05);
}

function scheduleMusic(){
if(!audioCtx||!state.running)return;
var t=0;

// Melody
for(var i=0;i<melody.length;i++){
var n=melody[i];
if(n[0]>0){
playNote(noteFreq(n[0]),t,n[1]*tempo*0.9,0.18,'sine');
playNote(noteFreq(n[0]+12),t,n[1]*tempo*0.9,0.06,'triangle');
}
t+=n[1]*tempo;
}

// Harmony
t=0;
for(var i=0;i<harmony.length;i++){
var n=harmony[i];
if(n[0]>0){
playNote(noteFreq(n[0]),t,n[1]*tempo*0.9,0.1,'triangle');
}
t+=n[1]*tempo;
}

// Bass
t=0;
for(var i=0;i<bass.length;i++){
var n=bass[i];
if(n[0]>0){
playNote(noteFreq(n[0]),t,n[1]*tempo*0.85,0.14,'sawtooth');
}
t+=n[1]*tempo;
}

// Counter-melody (call and response)
var counter=[
[0,3],[0,3],[72,0.5],[76,0.5],[79,1],[0,2],
[0,3],[0,1],[67,1],[72,1],[0,2],
[0,1],[60,0.5],[64,0.5],[67,1],[0,1],[55,2],
[0,1],[60,1],[0,2],[0,1],[76,1],[0,1],
];
t=0;
for(var i=0;i<counter.length;i++){
var n=counter[i];
if(n[0]>0){
playNote(noteFreq(n[0]),t,n[1]*tempo*0.8,0.07,'triangle');
}
t+=n[1]*tempo;
}

// Schedule next loop
var totalLen=t;
musicTimer=setTimeout(scheduleMusic,totalLen*1000);
}

function startMusic(){
if(isMuted)return;
if(!ensureAudio())return;
clearTimeout(musicTimer);
scheduleMusic();
}

function stopMusic(){
clearTimeout(musicTimer);
}

// Sound effects
function playPop(){
if(!ensureAudio()||isMuted)return;
var osc=audioCtx.createOscillator();
var g=audioCtx.createGain();
osc.type='sine';
osc.frequency.setValueAtTime(600,audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(200,audioCtx.currentTime+0.15);
g.gain.setValueAtTime(0.15,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15);
osc.connect(g);g.connect(audioCtx.destination);
osc.start();osc.stop(audioCtx.currentTime+0.2);
}

function playGhost(){
if(!ensureAudio()||isMuted)return;
var osc=audioCtx.createOscillator();
var g=audioCtx.createGain();
osc.type='sawtooth';
osc.frequency.setValueAtTime(300,audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.3);
g.gain.setValueAtTime(0.12,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
osc.connect(g);g.connect(audioCtx.destination);
osc.start();osc.stop(audioCtx.currentTime+0.35);
}

// Sound toggle
document.getElementById('btnSound').addEventListener('pointerdown',function(e){
e.preventDefault();
isMuted=!isMuted;
this.textContent=isMuted?'🔇':'🔊';
if(isMuted){
stopMusic();
if(musicGain)musicGain.gain.value=0;
}else{
if(musicGain)musicGain.gain.value=0.22;
if(state.running)startMusic();
}
});

// First interaction to unlock audio
document.addEventListener('pointerdown',function(e){
ensureAudio();
},{once:true});

// ============ INIT ============
buildHoles();
updateMenuButtons();
document.getElementById('menuTotalScore').textContent=state.totalScore;
